name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # Merge gate: unit tests, accuracy/precision evals, and the headline
      # benchmark must all pass. The eval harness exits non-zero on regression.
      - run: npm test
      - run: npm run eval
      - run: npm run benchmark
